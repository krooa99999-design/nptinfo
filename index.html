<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.6}
a{color:inherit}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.in{max-width:1180px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.logo{width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:32px;flex:none;position:relative}

.brand h1{margin:0;font-size:clamp(18px,3vw,26px);color:var(--navy)}

.brand p{margin:0;color:var(--mute)}
.sp{flex:1}
.srch{display:flex;gap:6px}.srch input{width:200px}
nav{background:var(--navy);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}

nav .it{position:relative}
nav .it>a,nav .it>button{display:block;color:#fff;text-decoration:none;padding:11px 16px;background:none;border:0;border-radius:0;font:inherit;cursor:pointer}

.menu{display:none;position:absolute;left:0;top:100%;min-width:260px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}

.menu a:hover{background:var(--head)}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.two{display:grid;grid-template-columns:250px 1fr;gap:20px}

.txt{white-space:pre-line;margin:6px 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--head)}

.dt{flex:none;min-width:90px;color:var(--gold);font-weight:700}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sv ul{margin:6px 0 0;padding-left:20px}.sv li{margin:3px 0}

.imgs figure{margin:0;position:relative}.imgs img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:9px}
button.pri{background:var(--gold);color:#1b1300;border-color:var(--gold);font-weight:700}
button.dng{color:#c0392b}button.x{position:absolute;right:6px;top:6px;padding:2px 8px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
td textarea,th textarea{min-width:90px;resize:vertical}

.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row img{width:110px;height:50px;object-fit:cover;border-radius:6px}

label{display:block;margin:6px 0}
footer{background:var(--navy2);color:#cfd8ee;text-align:center;padding:18px;font-size:14px;margin-top:20px}
h3.sec{margin:18px 0 8px;color:var(--navy);border-left:5px solid var(--gold);padding-left:10px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h3.sec{color:#fff}}
</style>
</head>

function sha256(ascii){
 function rr(v,a){return(v>>>a)|(v<<(32-a))}
 var mp=Math.pow,mw=mp(2,32),L='length',i,j,res='',words=[],bl=ascii[L]*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k[L],ic={};
 for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
 ascii+='\x80';while(ascii[L]%64-56)ascii+='\x00';
 for(i=0;i<ascii[L];i++){j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}
 words[words[L]]=((bl/mw)|0);words[words[L]]=bl;
 for(j=0;j<words[L];){
  var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){
   var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
  }
  for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
 }
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}
 return res;
}
const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function supOpen(it,iter,pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(it.s),iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(it.iv)},key,b2u(it.c));
 return JSON.parse(new TextDecoder().decode(pt));
}

const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function ghReq(path,method,body){
 const c=getGH();
 const u=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`+(method==='GET'?`?ref=${encodeURIComponent(c.branch)}`:'');
 return fetch(u,{method,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
}
async function ghPut(path,content,msg,check){
 const c=getGH();let sha;
 if(check){const g=await ghReq(path,'GET');if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('อ่านไฟล์ไม่สำเร็จ ('+g.status+')')}
 const p=await ghReq(path,'PUT',{message:msg,content,branch:c.branch,sha});
 if(!p.ok){let m=p.status;try{m=(await p.json()).message||m}catch(e){}throw new Error(m)}
}
async function up(d){const n='images/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';await ghPut(n,d.split(',')[1],'add image',false);return n}
async function pack(o,seen){
 for(const k of Object.keys(o)){const v=o[k];
  if(typeof v==='string'&&v.startsWith('data:image/')){if(!seen[v]){const p=await up(v);PREV[p]=v;seen[v]=p}o[k]=seen[v]}
  else if(v&&typeof v==='object')await pack(v,seen)}
}
